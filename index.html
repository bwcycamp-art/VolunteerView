<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026大專營義工報名查詢系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        /* 長按 3 秒的進度條動畫 */
        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progressFill 3s linear forwards;
        }
        /* 自定義捲軸樣式，讓手機與電腦體驗更一致 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * @fileoverview 2026大專營義工報名查詢系統 (前端獨立版)
         * @version 1.4.0 - 修正 UX 風險：實作雙軸鎖定 (固定表頭與姓名欄位)，優化手機端查閱體驗
         */

        const { useState, useEffect, useMemo, useRef } = React;

        // 預設表單網址
        const REGISTRATION_FORM_URL = "https://forms.gle/nGaz3QtQshyCFyW37";

        // 2026 Google Sheet 網路 CSV 連結
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVLjgvvd2zI3hdmklfAUkLWkBiqxKP2soHNtRX6M7uOU7GQdLfA77-WmNmBp6ZqpR7-HMnd6OcWE-d/pub?gid=1461714518&single=true&output=csv";

        /**
         * 處理剪貼簿複製邏輯
         * @param {string} text - 要複製的字串
         * @returns {Promise<boolean>} 是否複製成功
         */
        const copyToClipboard = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    return true;
                }
            } catch (error) {
                console.error("複製失敗:", error);
                return false;
            }
        };

        /**
         * 獨立組件：處理電話號碼的遮蔽與長按顯示邏輯
         * @param {Object} props
         * @param {string} props.phoneNumber - 原始電話號碼
         */
        const PhoneDisplayCell = ({ phoneNumber }) => {
            const [isVisible, setIsVisible] = useState(false);
            const [isPressing, setIsPressing] = useState(false);
            const pressTimer = useRef(null);

            const handlePressStart = (e) => {
                if (isVisible || !phoneNumber) return;
                // 僅允許左鍵點擊或觸控
                if (e.type === 'mousedown' && e.button !== 0) return;
                
                setIsPressing(true);
                pressTimer.current = setTimeout(() => {
                    setIsVisible(true);
                    setIsPressing(false);
                }, 3000); 
            };

            const handlePressEnd = () => {
                setIsPressing(false);
                if (pressTimer.current) {
                    clearTimeout(pressTimer.current);
                    pressTimer.current = null;
                }
            };

            const handleContextMenu = (e) => {
                e.preventDefault(); 
            };

            if (!phoneNumber) return <td className="px-3 py-1.5 text-xs text-gray-400 text-center">-</td>;

            const maskedNumber = phoneNumber.length >= 8 
                ? `${phoneNumber.substring(0, 4)}***${phoneNumber.substring(phoneNumber.length - 3)}`
                : "***";

            return (
                <td 
                    className={`px-3 py-1.5 text-xs text-gray-600 select-none cursor-pointer relative transition-colors ${isPressing ? 'bg-red-50' : ''}`}
                    onMouseDown={handlePressStart}
                    onMouseUp={handlePressEnd}
                    onMouseLeave={handlePressEnd}
                    onTouchStart={handlePressStart}
                    onTouchEnd={handlePressEnd}
                    onContextMenu={handleContextMenu}
                    title="長按 3 秒解鎖顯示"
                >
                    {isVisible ? phoneNumber : maskedNumber}
                    {isPressing && (
                        <div className="absolute bottom-0 left-0 h-0.5 bg-red-500 animate-progress" />
                    )}
                </td>
            );
        };

        /**
         * 主應用程式組件
         */
        const App = () => {
            const [volunteerList, setVolunteerList] = useState([]);
            const [parsedHeaders, setParsedHeaders] = useState([]);
            const [filterConfig, setFilterConfig] = useState({ type: null, value: null });
            const [isLoading, setIsLoading] = useState(true);
            const [copyStatus, setCopyStatus] = useState("");

            useEffect(() => {
                initApp();
            }, []);

            /**
             * 初始化應用程式：解析網址參數並從網路載入資料
             */
            const initApp = () => {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const largeGroupParam = urlParams.get('largeGroup');
                    const smallGroupParam = urlParams.get('smallGroup');

                    if (largeGroupParam) {
                        setFilterConfig({ type: '大組', value: largeGroupParam });
                    } else if (smallGroupParam) {
                        setFilterConfig({ type: '小組', value: smallGroupParam });
                    }

                    fetchAndParseCSV(CSV_URL);
                } catch (error) {
                    console.error("系統初始化參數解析失敗:", error);
                }
            };

            /**
             * 從網路連結獲取並解析 CSV 資料
             */
            const fetchAndParseCSV = async (url) => {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP 錯誤狀態: ${response.status}`);
                    const csvText = await response.text();
                    
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            const { meta, data: parsedRecords } = results;
                            setParsedHeaders(meta.fields || []);
                            setVolunteerList(parsedRecords || []);
                            setIsLoading(false);
                        },
                        error: (error) => {
                            console.error("CSV 解析錯誤:", error);
                            setIsLoading(false);
                        }
                    });
                } catch (error) {
                    console.error("獲取網路 CSV 失敗:", error);
                    setIsLoading(false);
                }
            };

            /**
             * 計算過濾與排序後的名單
             */
            const filteredVolunteers = useMemo(() => {
                let filteredList = volunteerList;
                
                if (filterConfig.type && filterConfig.value) {
                    filteredList = volunteerList.filter(row => {
                        const groupName = row[filterConfig.type] || "";
                        
                        if (filterConfig.type === '小組') {
                            if (filterConfig.value === '餐廳小組' && (groupName === '餐廳小組' || groupName.startsWith('餐廳/'))) {
                                return true;
                            }
                            if (filterConfig.value === '廚房小組' && (groupName === '廚房小組' || groupName.startsWith('廚房/'))) {
                                return true;
                            }
                        }
                        return groupName === filterConfig.value;
                    });
                }

                return filteredList.sort((a, b) => {
                    const groupA = a['小組'] || "";
                    const groupB = b['小組'] || "";
                    
                    if (groupA !== groupB) {
                        return groupA.localeCompare(groupB, 'zh-TW');
                    }
                    
                    const roleA = a['身分別'] || "";
                    const roleB = b['身分別'] || "";
                    if (roleA === roleB) return 0;
                    if (roleA === '幹部') return -1;
                    if (roleB === '幹部') return 1;
                    return roleA.localeCompare(roleB, 'zh-TW');
                });
            }, [volunteerList, filterConfig]);

            /**
             * 取得畫面上實際要顯示的表頭
             */
            const displayHeaders = useMemo(() => {
                return parsedHeaders.filter(header => header !== "出生年");
            }, [parsedHeaders]);

            /**
             * 統計相關數據
             */
            const manpowerStats = useMemo(() => {
                if (filteredVolunteers.length === 0) return null;
                
                const statsByDate = {};
                const validTypes = ['義工', '早餐', '午餐', '晚餐', '住宿'];

                parsedHeaders.forEach(header => {
                    const match = header.match(/^(\d{1,2}\/\d{2})(.*)$/);
                    if (match) {
                        const dateStr = match[1];
                        const itemType = match[2];

                        if (validTypes.includes(itemType)) {
                            if (!statsByDate[dateStr]) {
                                statsByDate[dateStr] = { 義工: 0, 早餐: 0, 午餐: 0, 晚餐: 0, 住宿: 0 };
                            }
                            statsByDate[dateStr][itemType] = filteredVolunteers.reduce((sum, row) => sum + (row[header] === "1" ? 1 : 0), 0);
                        }
                    }
                });

                const dailyStatsArray = Object.entries(statsByDate)
                    .map(([date, counts]) => ({ date, ...counts }))
                    .sort((a, b) => a.date.localeCompare(b.date));

                return { 
                    totalMembers: filteredVolunteers.length, 
                    dailyStats: dailyStatsArray 
                };
            }, [filteredVolunteers, parsedHeaders]);

            /**
             * 處理複製報名連結
             */
            const handleCopyLink = async () => {
                let message = `【重要】尚未填寫大專營義工報名的同行善友請注意：\n麻煩儘速撥冗填寫報名表單，以利後續作業，隨喜您的發心！\n報名網址：${REGISTRATION_FORM_URL}`;
                const success = await copyToClipboard(message);
                
                if (success) {
                    setCopyStatus("已複製轉傳訊息！");
                    setTimeout(() => setCopyStatus(""), 3000);
                } else {
                    setCopyStatus("複製失敗，請手動複製。");
                }
            };

            /**
             * 匯出 CSV
             */
            const handleExportCSV = () => {
                try {
                    const csv = Papa.unparse(filteredVolunteers);
                    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' }); 
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    
                    link.setAttribute("href", url);
                    link.setAttribute("download", `${filterConfig.value || '全體'}_義工名單.csv`);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error("匯出 CSV 失敗:", error);
                }
            };

            if (isLoading) {
                return <div className="flex h-screen items-center justify-center text-xl font-medium text-gray-600">載入 2026 資料源中...</div>;
            }

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    {/* Header Section */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800">
                                {filterConfig.value ? `${filterConfig.value} - 義工報名狀態` : "全體義工報名狀態 (未過濾)"}
                            </h1>
                            <p className="text-sm text-gray-500 mt-1">您可以分享此頁面網址給幹部，系統自動從資料庫帶入過濾條件。</p>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <button 
                                onClick={handleExportCSV}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm"
                            >
                                匯出此組名單
                            </button>
                            <div className="relative">
                                <button 
                                    onClick={handleCopyLink}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm"
                                >
                                    複製催報名訊息
                                </button>
                                {copyStatus && (
                                    <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs py-1 px-3 rounded shadow-lg whitespace-nowrap z-50">
                                        {copyStatus}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Statistics Section */}
                    {manpowerStats && (
                        <div className="mb-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-4">
                                <div className="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-200 flex flex-col justify-center items-center text-center">
                                    <div className="text-sm text-gray-600 font-medium">本組已報名總數</div>
                                    <div className="text-4xl font-bold text-blue-700 mt-2">{manpowerStats.totalMembers} <span className="text-lg text-gray-500 font-normal">人</span></div>
                                </div>
                                
                                {manpowerStats.dailyStats.map(stat => (
                                    <div key={stat.date} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                        <div className="text-lg text-gray-800 font-bold border-b border-gray-100 pb-2 mb-3 text-center">
                                            {stat.date} 統計
                                        </div>
                                        <div className="grid grid-cols-2 gap-y-2 gap-x-4 text-sm">
                                            <div className="flex justify-between text-gray-600 bg-gray-50 px-2 py-1 rounded">
                                                <span>義工</span>
                                                <span className="font-bold text-gray-800">{stat['義工']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 bg-gray-50 px-2 py-1 rounded">
                                                <span>住宿</span>
                                                <span className="font-bold text-gray-800">{stat['住宿']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1">
                                                <span>早餐</span>
                                                <span className="font-bold text-gray-800">{stat['早餐']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1">
                                                <span>午餐</span>
                                                <span className="font-bold text-gray-800">{stat['午餐']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1 col-span-2">
                                                <span>晚餐</span>
                                                <span className="font-bold text-gray-800">{stat['晚餐']}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Data Table with Dual-Axis Sticky */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        {/* 限制高度並允許雙向滾動，啟動 Sticky 定位 */}
                        <div className="overflow-auto custom-scrollbar max-h-[65vh] relative">
                            <table className="w-full text-sm text-left whitespace-nowrap min-w-max border-collapse">
                                {/* 表頭鎖定在最上方 (z-20) */}
                                <thead className="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0 z-20 shadow-[0_1px_2px_rgba(0,0,0,0.1)]">
                                    <tr>
                                        {displayHeaders.map((header, index) => {
                                            const match = header.match(/^(\d{1,2}\/\d{2})(.*)$/);
                                            const isVolunteerCol = match && match[2] === '義工';
                                            const isNameCol = header === '姓名';
                                            
                                            let borderClass = isVolunteerCol ? "border-l-2 border-gray-300" : "border-b border-gray-200";
                                            // 姓名表頭：同時具備 top-0 與 left-0 鎖定，層級最高 (z-30)
                                            let stickyClass = isNameCol ? "sticky left-0 z-30 bg-gray-100 border-r-2 border-gray-300 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.15)]" : "bg-gray-50";

                                            if (match) {
                                                return (
                                                    <th key={index} className={`px-1.5 py-2 font-medium text-center align-bottom ${borderClass} ${stickyClass}`}>
                                                        <div className="text-[10px] text-gray-400 font-normal leading-none mb-1">{match[1]}</div>
                                                        <div className="leading-none">{match[2]}</div>
                                                    </th>
                                                );
                                            }
                                            return (
                                                <th key={index} className={`px-3 py-2 font-medium align-bottom ${borderClass} ${stickyClass}`}>
                                                    {header}
                                                </th>
                                            );
                                        })}
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredVolunteers.length > 0 ? (
                                        filteredVolunteers.map((row, rowIndex) => (
                                            <tr key={rowIndex} className="border-b border-gray-100 hover:bg-blue-50 transition-colors group">
                                                {displayHeaders.map((header, colIndex) => {
                                                    const val = row[header];
                                                    const match = header.match(/^(\d{1,2}\/\d{2})(.*)$/);
                                                    const isVolunteerCol = match && match[2] === '義工';
                                                    const isNameCol = header === '姓名';
                                                    const isDateCol = !!match;
                                                    
                                                    let borderClass = isVolunteerCol ? "border-l-2 border-gray-300" : "";
                                                    // 姓名資料格：鎖定在左側 (z-10)，並透過 group-hover 同步整行的 hover 變色效果
                                                    let stickyClass = isNameCol ? "sticky left-0 z-10 bg-white group-hover:bg-blue-50 border-r-2 border-gray-300 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)] font-medium text-gray-800" : "";
                                                    
                                                    // 特殊欄位：電話防護
                                                    if (header === '電話') {
                                                        return <PhoneDisplayCell key={colIndex} phoneNumber={val} />;
                                                    }

                                                    // 針對數字 1 進行視覺優化 (例如便當、住宿)
                                                    const displayVal = (val === "1" && isDateCol) 
                                                        ? <span className="inline-flex items-center justify-center w-4 h-4 bg-green-100 text-green-700 rounded-full text-[10px] font-bold">✓</span> 
                                                        : (val === "0" && isDateCol) ? <span className="text-gray-300">-</span> : val;

                                                    return (
                                                        <td key={colIndex} className={`py-1.5 text-gray-600 text-xs ${isDateCol ? 'px-1.5 text-center' : 'px-3'} ${borderClass} ${stickyClass}`}>
                                                            {displayVal}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan={displayHeaders.length} className="px-4 py-8 text-center text-gray-500">
                                                找不到符合條件的義工資料。
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
