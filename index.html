<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026大專營義工報名查詢系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用穩定的 jsDelivr CDN 更換原 unpkg，確保高可用性與載入速度 -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progressFill 3s linear forwards;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * @fileoverview 2026大專營義工報名查詢系統 (安全加固穩定版)
         * @version 1.9.0 - 新增 ErrorBoundary 錯誤邊界，全面防護 Null/Undefined 指標崩潰，修復 Mutate 隱患與優化 CDN
         */

        const { useState, useEffect, useMemo, useRef } = React;

        const REGISTRATION_FORM_URL = "https://forms.gle/nGaz3QtQshyCFyW37";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVLjgvvd2zI3hdmklfAUkLWkBiqxKP2soHNtRX6M7uOU7GQdLfA77-WmNmBp6ZqpR7-HMnd6OcWE-d/pub?gid=1461714518&single=true&output=csv";

        /**
         * 錯誤安全防線元件 (Error Boundary)
         * 當下層組件發生未捕獲的例外時，提供優雅的降級 UI，杜絕全白畫面
         */
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("安全防線攔截到嚴重崩潰:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border border-red-100 text-center">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-red-100 text-red-600 rounded-full text-3xl font-bold mb-4">!</div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2">系統報表加載或渲染發生異常</h2>
                                <p className="text-sm text-gray-500 mb-6 leading-relaxed">
                                    這通常是由於 Google 試算表格式異動（例如：產生了空白列、標題格式更改）或網路暫時中斷所致。請確認後台試算表發佈狀態後重試。
                                </p>
                                <div className="bg-gray-50 p-4 rounded-xl text-left text-xs font-mono text-red-600 overflow-auto max-h-40 mb-6 border border-gray-100">
                                    {this.state.error?.toString()}
                                </div>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-all shadow-md active:scale-[0.98]"
                                >
                                    重新整理網頁
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        /**
         * 執行剪貼簿寫入作業
         * @param {string} text 
         * @returns {Promise<boolean>} 
         */
        const copyToClipboard = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    return true;
                }
            } catch (error) {
                console.error("複製失敗:", error);
                return false;
            }
        };

        /**
         * 從 URL 查詢字串中安全地提取參數值，保留原始的 '+' 號而不被自動解碼為空格。
         * @param {string} paramName - 欲提取的參數名稱
         * @returns {string|null} 解碼後的參數值
         */
        const getSafeQueryParam = (paramName) => {
            const searchString = window.location.search;
            if (!searchString) return null;
            
            const pattern = new RegExp('[?&]' + paramName + '=([^&]*)');
            const match = searchString.match(pattern);
            if (!match) return null;

            const rawValue = match[1];
            const normalizedValue = rawValue.replace(/\+/g, '%2B');
            
            try {
                return decodeURIComponent(normalizedValue);
            } catch (error) {
                console.error(`解析網址參數 ${paramName} 時發生解碼錯誤:`, error);
                return null;
            }
        };

        /**
         * 電話號碼保護元件
         */
        const PhoneDisplayCell = ({ phoneNumber }) => {
            const [isVisible, setIsVisible] = useState(false);
            const [isPressing, setIsPressing] = useState(false);
            const pressTimer = useRef(null);

            const handlePressStart = (e) => {
                if (isVisible || !phoneNumber) return;
                if (e.type === 'mousedown' && e.button !== 0) return;
                
                setIsPressing(true);
                pressTimer.current = setTimeout(() => {
                    setIsVisible(true);
                    setIsPressing(false);
                }, 3000); 
            };

            const handlePressEnd = () => {
                setIsPressing(false);
                if (pressTimer.current) {
                    clearTimeout(pressTimer.current);
                    pressTimer.current = null;
                }
            };

            const handleContextMenu = (e) => {
                e.preventDefault(); 
            };

            if (!phoneNumber) return <td className="px-3 py-1.5 text-xs text-gray-400 text-center border-b border-gray-100">-</td>;

            const maskedNumber = phoneNumber.length >= 8 
                ? `${phoneNumber.substring(0, 4)}***${phoneNumber.substring(phoneNumber.length - 3)}`
                : "***";

            return (
                <td 
                    className={`px-3 py-1.5 text-xs text-gray-600 select-none cursor-pointer relative transition-colors border-b border-gray-100 ${isPressing ? 'bg-red-50' : ''}`}
                    onMouseDown={handlePressStart}
                    onMouseUp={handlePressEnd}
                    onMouseLeave={handlePressEnd}
                    onTouchStart={handlePressStart}
                    onTouchEnd={handlePressEnd}
                    onContextMenu={handleContextMenu}
                    title="長按 3 秒解鎖顯示"
                >
                    {isVisible ? phoneNumber : maskedNumber}
                    {isPressing && (
                        <div className="absolute bottom-0 left-0 h-0.5 bg-red-500 animate-progress" />
                    )}
                </td>
            );
        };

        const App = () => {
            const [volunteerList, setVolunteerList] = useState([]);
            const [parsedHeaders, setParsedHeaders] = useState([]);
            const [filterConfig, setFilterConfig] = useState({ type: null, value: null });
            const [isLoading, setIsLoading] = useState(true);
            const [copyStatus, setCopyStatus] = useState("");

            useEffect(() => {
                initApp();
            }, []);

            const initApp = () => {
                try {
                    const largeGroupParam = getSafeQueryParam('largeGroup');
                    const smallGroupParam = getSafeQueryParam('smallGroup');

                    if (largeGroupParam) {
                        setFilterConfig({ type: '大組', value: largeGroupParam });
                    } else if (smallGroupParam) {
                        setFilterConfig({ type: '小組', value: smallGroupParam });
                    }

                    fetchAndParseCSV(CSV_URL);
                } catch (error) {
                    console.error("參數解析失敗:", error);
                }
            };

            const fetchAndParseCSV = async (url) => {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP 狀態異常: ${response.status}`);
                    const csvText = await response.text();
                    
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            const rawFields = results.meta.fields || [];
                            // 安全防禦：過濾掉 undefined、null 以及空字串表頭，徹底避免後面 match 出錯崩潰
                            const cleanFields = rawFields.filter(f => f && typeof f === 'string' && f.trim() !== '');
                            
                            setParsedHeaders(cleanFields);
                            setVolunteerList(results.data || []);
                            setIsLoading(false);
                        },
                        error: (error) => {
                            console.error("CSV 解析異常:", error);
                            setIsLoading(false);
                        }
                    });
                } catch (error) {
                    console.error("資料獲取異常:", error);
                    setIsLoading(false);
                }
            };

            const filteredVolunteers = useMemo(() => {
                let filteredList = volunteerList;
                
                if (filterConfig.type && filterConfig.value) {
                    filteredList = volunteerList.filter(row => {
                        const groupName = row[filterConfig.type] || "";
                        if (filterConfig.type === '小組') {
                            if (filterConfig.value === '餐廳小組' && (groupName === '餐廳小組' || groupName.startsWith('餐廳/'))) return true;
                            if (filterConfig.value === '廚房小組' && (groupName === '廚房小組' || groupName.startsWith('廚房/'))) return true;
                        }
                        return groupName === filterConfig.value;
                    });
                }

                // 安全防禦：[...filteredList] 先複製陣列再排序，杜絕 React 狀態原地突變引發的渲染死鎖
                return [...filteredList].sort((a, b) => {
                    const groupA = a['小組'] || "";
                    const groupB = b['小組'] || "";
                    if (groupA !== groupB) return groupA.localeCompare(groupB, 'zh-TW');
                    
                    const roleA = a['身分別'] || "";
                    const roleB = b['身分別'] || "";
                    if (roleA === roleB) return 0;
                    if (roleA === '幹部') return -1;
                    if (roleB === '幹部') return 1;
                    return roleA.localeCompare(roleB, 'zh-TW');
                });
            }, [volunteerList, filterConfig]);

            const displayHeaders = useMemo(() => {
                // 安全過濾防止 parsedHeaders 中含有非預期類型
                return parsedHeaders.filter(header => header && typeof header === 'string' && header !== "出生年");
            }, [parsedHeaders]);

            const manpowerStats = useMemo(() => {
                if (filteredVolunteers.length === 0) return null;
                
                const statsByDate = {};
                const validTypes = ['義工', '早餐', '午餐', '晚餐', '住宿'];

                filteredVolunteers.forEach(row => {
                    parsedHeaders.forEach(header => {
                        if (!header || typeof header !== 'string') return; // 型態守衛
                        const match = header.match(/^(\d{1,2}\/\d{2})(.*)$/);
                        if (match) {
                            const dateStr = match[1];
                            const itemType = match[2];

                            if (validTypes.includes(itemType)) {
                                if (!statsByDate[dateStr]) {
                                    statsByDate[dateStr] = { 義工: 0, 早餐: 0, 午餐: 0, 晚餐: 0, 住宿: 0 };
                                }
                                statsByDate[dateStr][itemType] += (row[header] === "1" ? 1 : 0);
                            }
                        }
                    });
                });

                const dailyStatsArray = Object.entries(statsByDate)
                    .map(([date, counts]) => ({ date, ...counts }))
                    .sort((a, b) => a.date.localeCompare(b.date));

                return { 
                    totalMembers: filteredVolunteers.length, 
                    dailyStats: dailyStatsArray 
                };
            }, [filteredVolunteers, parsedHeaders]);

            const handleCopyLink = async () => {
                const message = `【重要】尚未填寫大專營義工報名的同行善友請注意：\n麻煩儘速撥冗填寫報名表單，以利後續作業，隨喜您的發心！\n報名網址：${REGISTRATION_FORM_URL}`;
                const success = await copyToClipboard(message);
                
                if (success) {
                    setCopyStatus("已複製轉傳訊息！");
                    setTimeout(() => setCopyStatus(""), 3000);
                } else {
                    setCopyStatus("複製失敗，請手動複製。");
                }
            };

            const handleExportCSV = () => {
                try {
                    const csv = Papa.unparse(filteredVolunteers);
                    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' }); 
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    
                    link.setAttribute("href", url);
                    link.setAttribute("download", `${filterConfig.value || '全體'}_義工名單.csv`);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error("匯出異常:", error);
                }
            };

            if (isLoading) {
                return (
                    <div className="flex h-screen flex-col items-center justify-center text-gray-500 bg-gray-50">
                        <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <div className="text-lg font-medium">安全載入 2026 最新義工報名資料中...</div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800">
                                {filterConfig.value ? `${filterConfig.value} - 義工報名狀態` : "全體義工報名狀態 (未過濾)"}
                            </h1>
                            <p className="text-sm text-gray-500 mt-1">您可以分享此頁面網址給幹部，系統自動從資料庫帶入過濾條件。</p>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <button 
                                onClick={handleExportCSV}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95"
                            >
                                匯出此組名單
                            </button>
                            <div className="relative">
                                <button 
                                    onClick={handleCopyLink}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95"
                                >
                                    複製催報名訊息
                                </button>
                                {copyStatus && (
                                    <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs py-1 px-3 rounded shadow-lg whitespace-nowrap z-50">
                                        {copyStatus}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {manpowerStats && (
                        <div className="mb-6">
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-7 gap-4">
                                <div className="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-200 flex flex-col justify-center items-center text-center">
                                    <div className="text-sm text-gray-600 font-medium">本組報名總數</div>
                                    <div className="text-3xl font-bold text-blue-700 mt-2">{manpowerStats.totalMembers} <span className="text-sm text-gray-500 font-normal">人</span></div>
                                </div>
                                
                                {manpowerStats.dailyStats.map(stat => (
                                    <div key={stat.date} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                        <div className="text-lg text-gray-800 font-bold border-b border-gray-100 pb-2 mb-3 text-center">
                                            {stat.date} 統計
                                        </div>
                                        <div className="grid grid-cols-2 gap-y-2 gap-x-4 text-xs">
                                            <div className="flex justify-between text-gray-600 bg-gray-50 px-2 py-1 rounded">
                                                <span>義工</span>
                                                <span className="font-bold text-gray-800">{stat['義工']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 bg-gray-50 px-2 py-1 rounded">
                                                <span>住宿</span>
                                                <span className="font-bold text-gray-800">{stat['住宿']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1">
                                                <span>早餐</span>
                                                <span className="font-bold text-gray-800">{stat['早餐']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1">
                                                <span>午餐</span>
                                                <span className="font-bold text-gray-800">{stat['午餐']}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600 px-2 py-1 col-span-2">
                                                <span>晚餐</span>
                                                <span className="font-bold text-gray-800">{stat['晚餐']}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="overflow-auto custom-scrollbar max-h-[65vh] relative">
                            <table className="w-full text-sm text-left whitespace-nowrap min-w-max border-collapse">
                                <thead className="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0 z-20 shadow-[0_1px_2px_rgba(0,0,0,0.1)]">
                                    <tr>
                                        {displayHeaders.map((header, index) => {
                                            const match = (header && typeof header === 'string') ? header.match(/^(\d{1,2}\/\d{2})(.*)$/) : null;
                                            const isVolunteerCol = match && match[2] === '義工';
                                            const isNameCol = header === '姓名';
                                            
                                            let borderClass = isVolunteerCol ? "border-l-2 border-gray-300" : "border-b border-gray-200";
                                            let stickyClass = isNameCol ? "sticky left-0 z-30 bg-gray-100 border-r-2 border-gray-300 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.15)]" : "bg-gray-50";

                                            if (match) {
                                                return (
                                                    <th key={index} className={`px-1.5 py-2 font-medium text-center align-bottom ${borderClass} ${stickyClass}`}>
                                                        <div className="text-[10px] text-gray-400 font-normal leading-none mb-1">{match[1]}</div>
                                                        <div className="leading-none">{match[2]}</div>
                                                    </th>
                                                );
                                            }
                                            return (
                                                <th key={index} className={`px-3 py-2 font-medium align-bottom ${borderClass} ${stickyClass}`}>
                                                    {header}
                                                </th>
                                            );
                                        })}
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredVolunteers.length > 0 ? (
                                        filteredVolunteers.map((row, rowIndex) => (
                                            <tr key={rowIndex} className="border-b border-gray-100 hover:bg-blue-50 transition-colors group">
                                                {displayHeaders.map((header, colIndex) => {
                                                    const val = row[header];
                                                    const match = (header && typeof header === 'string') ? header.match(/^(\d{1,2}\/\d{2})(.*)$/) : null;
                                                    const isVolunteerCol = match && match[2] === '義工';
                                                    const isNameCol = header === '姓名';
                                                    const isDateCol = !!match;
                                                    const valIsChecked = val === "1";
                                                    
                                                    let borderClass = isVolunteerCol ? "border-l-2 border-gray-300" : "";
                                                    let stickyClass = isNameCol ? "sticky left-0 z-10 bg-white group-hover:bg-blue-50 border-r-2 border-gray-300 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)] font-medium text-gray-800" : "";
                                                    
                                                    if (header === '電話') {
                                                        return <PhoneDisplayCell key={colIndex} phoneNumber={val} />;
                                                    }

                                                    let displayVal = null;
                                                    let anomalyClass = "";

                                                    if (isDateCol) {
                                                        const dateStr = match[1];
                                                        const itemType = match[2];
                                                        const isVolunteer = row[`${dateStr}義工`] === "1";
                                                        
                                                        const hasMeals = ['早餐', '午餐', '晚餐'].some(type => row[`${dateStr}${type}`] === "1");
                                                        const isConflict = !isVolunteer && hasMeals;

                                                        if (isConflict) {
                                                            if (itemType === '義工') {
                                                                anomalyClass = "bg-yellow-100/80"; 
                                                                displayVal = <span className="text-yellow-600 font-bold" title="未排班卻有餐飲">-</span>;
                                                            } else if (valIsChecked && ['早餐', '午餐', '晚餐'].includes(itemType)) {
                                                                anomalyClass = "bg-red-100/80"; 
                                                                displayVal = <span className="inline-flex items-center justify-center w-4 h-4 bg-red-500 text-white rounded-full text-[10px] font-bold" title="未排班卻勾選">!</span>;
                                                            } else if (valIsChecked && itemType === '住宿') {
                                                                displayVal = <span className="inline-flex items-center justify-center w-4 h-4 bg-green-100 text-green-700 rounded-full text-[10px] font-bold">✓</span>;
                                                            } else {
                                                                displayVal = <span className="text-gray-300">-</span>;
                                                            }
                                                        } else {
                                                            displayVal = valIsChecked 
                                                                ? <span className="inline-flex items-center justify-center w-4 h-4 bg-green-100 text-green-700 rounded-full text-[10px] font-bold">✓</span> 
                                                                : (val === "0" || !val) ? <span className="text-gray-300">-</span> : val;
                                                        }
                                                    } else {
                                                        displayVal = val;
                                                    }

                                                    return (
                                                        <td key={colIndex} className={`py-1.5 text-gray-600 text-xs ${isDateCol ? 'px-1.5 text-center' : 'px-3'} ${borderClass} ${stickyClass} ${anomalyClass}`}>
                                                            {displayVal}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan={displayHeaders.length} className="px-4 py-8 text-center text-gray-500">
                                                無符合條件的數據記錄。
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
